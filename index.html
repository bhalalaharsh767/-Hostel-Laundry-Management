<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hostel Laundry Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Decorative Ambient Orbs -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon-glow">
            <span class="logo-emoji">🧺</span>
          </div>
          <div>
            <h1>Hostel Laundry</h1>
            <p class="subtitle">Live Shared Multi-Device Tracker</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="reset-btn" class="btn btn-glass-danger btn-small" title="Reset all data for a new day">
            <span class="btn-icon">🔄</span> Reset
          </button>
        </div>
      </div>
    </header>

    <!-- Toast Notification Banner -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Date Banner & Live Indicator -->
      <div class="top-info-bar">
        <div class="date-chip">
          <span class="date-icon">📅</span>
          <span id="current-date" class="date-value"></span>
        </div>
        <div class="live-sync-chip" id="sync-status">
          <span class="sync-ping"></span> Live Sync Active
        </div>
      </div>

      <!-- Main Laundry Entry Card -->
      <div class="card glass-card table-card">
        <div class="table-responsive">
          <table class="laundry-table" id="laundry-table">
            <thead>
              <tr>
                <th class="col-name">👤 NAME</th>
                <th class="col-item">👖 PANT</th>
                <th class="col-item">👕 SHIRT</th>
                <th class="col-item">👕 T-SHIRT</th>
                <th class="col-item">🩳 TRACK</th>
                <th class="col-item">🧣 TOWEL</th>
                <th class="col-total">🔢 TOTAL</th>
                <th class="col-save">💾 SAVE</th>
              </tr>
            </thead>
            <tbody id="student-table-body">
              <!-- Exactly 5 Student Rows with Touch Steppers & Save Buttons -->
            </tbody>
            <tfoot>
              <tr class="total-row">
                <td class="col-name total-label-cell">TOTAL</td>
                <td class="col-item total-val-cell" id="sum-pant">0</td>
                <td class="col-item total-val-cell" id="sum-shirt">0</td>
                <td class="col-item total-val-cell" id="sum-tshirt">0</td>
                <td class="col-item total-val-cell" id="sum-track">0</td>
                <td class="col-item total-val-cell" id="sum-towel">0</td>
                <td class="col-total total-val-cell">
                  <span class="total-badge grand-total-badge" id="sum-grand-total">0</span>
                </td>
                <td class="col-save"></td>
              </tr>
            </tfoot>
          </table>
        </div>

        <!-- Sticky Floating Bottom Submit Bar -->
        <div class="table-action-footer">
          <button type="button" id="send-all-btn" class="btn btn-gradient-send">
            <span class="btn-icon">🚀</span> SEND ALL LAUNDRY
          </button>
          <div id="send-all-status" class="send-all-status"></div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Hostel Laundry Tracker &bull; Real-time Multi-Device Sync</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
